[project]
name = "voice-client"
version = "0.1.0"
description = "Local bilingual voice assistant with HTTP STT and LLM backends"
readme = "README.md"
license = "MIT"
authors = [
    { name = "suhermanme", email = "edy.suherman@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "pyside6-essentials>=6.11.2",
    "sounddevice>=0.5.6",
    "supertonic>=1.3.1",
]

[tool.uv]
package = false
